<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meme Arcana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+SC:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
/* Layout: a tarot reading table under a starry royal-blue sky. Season counters on top, the three-slot hand below, the wax-seal button and drops in the middle, the 36-arcana collection at the bottom. */
:root{
  --night:#1c2a78; --night-2:#26379a; --night-3:#3346b8;
  --fg:#fbf3de; --muted:#c3cdf5; --line:rgba(246,196,49,.5);
  --sun:#f6c431; --sun-2:#ffe27a; --sun-ink:#3b2a0c;
  --red:#d7382b; --red-2:#f0604a; --green:#3f9a4a; --sky:#6fb4f0;
  --paper:#fbf3de; --paper-2:#efe3c4; --ink:#1a1410; --ink-soft:#5c5345;
  --anti:#b3261e; --anti-soft:#6b1d15; --good:#2e7d3a;
  --display:"Cormorant SC",Georgia,"Times New Roman",serif;
  --body:Alegreya,Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--night);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(255,226,122,.9) 0 1.2px,transparent 2px),
    radial-gradient(circle at 63% 72%,rgba(255,255,255,.7) 0 1px,transparent 1.6px),
    radial-gradient(circle at 84% 34%,rgba(255,226,122,.8) 0 1.4px,transparent 2.2px),
    radial-gradient(circle at 38% 52%,rgba(255,255,255,.55) 0 .9px,transparent 1.5px),
    radial-gradient(ellipse at 50% -10%,var(--night-3) 0%,var(--night) 65%);
  background-size:190px 190px,240px 240px,310px 310px,150px 150px,100% 100%;background-attachment:fixed}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--sun-2);outline-offset:3px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-size:clamp(38px,6.5vw,60px);color:var(--sun);line-height:.95;text-shadow:0 2px 0 var(--red)}
.brand p{margin:8px 0 0;color:var(--muted);font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.stat{border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;min-width:92px;background:rgba(255,255,255,.07)}
.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--sun-2);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:28px;color:var(--sun)}
.sec-h .hint{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{min-height:220px;border-radius:12px;display:flex;flex-direction:column}
.slot.empty{border:2px dashed var(--line);align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:12px;text-align:center;background:rgba(255,255,255,.04)}
.slot.block{border:2px solid var(--line);background:repeating-linear-gradient(45deg,rgba(246,196,49,.12) 0 8px,transparent 8px 16px);align-items:center;justify-content:center;gap:10px;color:var(--sun-2);padding:12px;text-align:center;font-family:var(--display);font-size:18px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:30px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--sun);color:var(--sun-ink);border-color:var(--sun);font-weight:700}
.sets .none{color:var(--muted);font-size:14px}

/* Card */
.card{border-radius:12px;padding:8px;display:flex;flex-direction:column;flex:1;position:relative}
.fr-c{background:#3f78d1;border:1.5px solid #17245f;box-shadow:inset 0 0 0 2px #9cc3ff}
.fr-r{background:linear-gradient(135deg,#ffffff 0%,#a3a9b0 30%,#f1f3f6 55%,#8e959d 80%,#e6e9ed 100%);border:1.5px solid #5b626a}
.fr-e{background:linear-gradient(135deg,#fff0b8 0%,#d69a22 28%,#ffe38c 52%,#b27a12 78%,#ffe08f 100%);border:1.5px solid #7a5516}
.fr-l{background:linear-gradient(125deg,#ff9ad5 0%,#8fe1ff 18%,#b7f59a 36%,#fff08a 54%,#c9a3ff 72%,#8fe1ff 86%,#ff9ad5 100%);border:1.5px solid #6b4fa8;box-shadow:0 0 24px rgba(201,163,255,.55)}
.fr-m{background:radial-gradient(circle at 82% 18%,rgba(122,82,32,.3) 0,rgba(122,82,32,0) 60px),radial-gradient(circle at 16% 78%,rgba(122,82,32,.24) 0,rgba(122,82,32,0) 50px),#ddcba6;border-radius:3px;clip-path:polygon(0 0,100% 0,100% 88%,97% 90%,99% 93%,95% 95%,98% 98%,93% 100%,0 100%)}
.face{flex:1;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:7px;padding:8px 9px 9px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fr-m .face{background:#eadcbc;color:#4a3a28;border-color:#6b5a42;border-radius:2px}
.meta{display:flex;justify-content:space-between;gap:6px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em}
.meta .rar{color:var(--ink-soft);font-weight:600}
.window{height:112px;border:2px solid var(--ink);border-radius:56px 56px 3px 3px;overflow:hidden;background:var(--paper-2);display:flex}
.window svg{width:100%;height:100%;display:block}
.name{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;text-align:center;text-wrap:balance;background:var(--red);color:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:3px 6px}
.fr-m .name{background:#6b5a42}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tag{border:1.5px solid var(--ink);border-radius:999px;padding:0 7px;font-size:11px;line-height:17px;font-weight:700;color:var(--ink)}
.t-B{background:#ff9ad5}.t-S{background:#ff8a6a}.t-D{background:#b9a3ff}.t-A{background:#8fdc7a}.t-I{background:#8fd0ff}.t-R{background:#ffd35a}
.lbl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:6px}
.lbl .st{color:#b8860b;letter-spacing:.12em}
.txt{font-size:13px;line-height:1.3}
.anti .lbl{color:var(--anti)}
.anti .txt{color:var(--anti-soft)}
.flav{margin-top:auto;border-top:1px solid #d4c6a4;padding-top:5px;text-align:center;font-style:italic;font-size:12px;color:var(--ink-soft)}
.off{font-size:12px;font-weight:700;color:var(--anti);text-align:center;border:1.5px solid var(--anti);border-radius:6px;padding:2px 4px}
.card.dim .face{opacity:.6}
.slot .window{height:64px}

/* Table */
.table{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.seal-col{display:flex;flex-direction:column;align-items:center;gap:12px}
.seal{width:180px;height:180px;border-radius:50%;border:none;cursor:pointer;position:relative;
  background:radial-gradient(circle at 35% 30%,var(--red-2) 0%,var(--red) 50%,#8f1d13 100%);
  box-shadow:0 0 0 7px var(--sun),0 0 0 10px rgba(246,196,49,.25),0 12px 30px rgba(0,0,0,.45),inset 0 -8px 16px rgba(60,8,4,.5);
  color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s ease}
.seal::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,226,122,.7)}
.seal b{font-family:var(--display);font-size:34px;letter-spacing:.08em;line-height:1;color:var(--sun-2)}
.seal span{font-size:14px;font-variant-numeric:tabular-nums}
.seal:active:not(:disabled){transform:scale(.94)}
.seal:disabled{cursor:not-allowed;filter:grayscale(.7) brightness(.75)}
.mini-btns{display:flex;flex-direction:column;gap:8px;width:100%}
.btn{border:1.5px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--sun);color:var(--sun-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--sun);color:var(--sun-ink);border-color:var(--sun);font-weight:700}
.btn.gold:hover:not(:disabled){background:var(--sun-2);color:var(--sun-ink)}
.drops{display:flex;flex-direction:column;gap:12px;min-width:0}
.drop-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.drop{display:flex;flex-direction:column;gap:8px}
.stamp{position:absolute;top:18px;right:-8px;transform:rotate(8deg);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;padding:2px 10px;border-radius:4px;border:2px solid currentColor;background:var(--paper);z-index:2}
.stamp.new{color:var(--good)}
.stamp.dup{color:#6b6253}
.stamp.mask{color:var(--anti)}
.empty-table{border:2px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.04)}
.empty-table b{font-family:var(--display);font-size:24px;color:var(--sun-2)}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.log li{border-left:2px solid var(--line);padding-left:10px}
.log li b{color:var(--sun-2);font-weight:500}

.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.cc{border:none;cursor:pointer;padding:5px;border-radius:9px;min-height:150px;display:flex;text-align:left}
.cc .face{padding:5px;gap:3px}
.cc .thumb{height:62px;border:1.5px solid var(--ink);border-radius:30px 30px 2px 2px;overflow:hidden;display:flex}
.cc .thumb svg{width:100%;height:100%}
.cc .n{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.1}
.cc .y{font-family:var(--display);font-size:11px;letter-spacing:.06em;color:var(--ink-soft)}
.cc .q{margin:auto;font-family:var(--display);font-size:40px;color:rgba(26,20,16,.3)}
.cc .cnt{margin-top:auto;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cc.locked .face{background:#d9ceb3}
.cc.sel{outline:3px solid var(--sun-2);outline-offset:2px}
.detail{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:rgba(255,255,255,.06)}
.detail .lv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px;margin:0}
.detail .lv dt{color:var(--sun);font-family:var(--display);font-weight:700;letter-spacing:.1em}
.detail .lv dd{margin:0}
.detail h3{font-size:28px;color:var(--sun);margin-bottom:8px}
.detail p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:60ch}

.veil{position:fixed;inset:0;background:rgba(12,16,52,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--night-2);border:2px solid var(--sun);border-radius:14px;max-width:560px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.sheet h2{font-size:36px;color:var(--sun)}
.sheet p{margin:0}
.sheet ul{margin:0;padding-left:20px;color:var(--muted)}
.rick{font-family:var(--display);font-size:clamp(28px,5vw,44px);color:var(--sun-2);text-align:center;line-height:1.2}
.longcat{width:120px;height:260px;margin:0 auto 14px;border:3px solid var(--sun);border-radius:60px 60px 6px 6px;overflow:hidden;display:flex;animation:stretch 2.5s ease-in-out infinite alternate}.longcat svg{width:100%;height:100%}@keyframes stretch{from{height:160px}to{height:300px}}
.rick small{display:block;font-family:var(--body);font-size:16px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:10px 16px;max-width:min(520px,calc(100% - 32px));box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:40;font-size:15px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}

/* Opening animation */
.anim{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 45%,var(--night-3) 0%,#0c1240 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px;overflow:auto;cursor:pointer}
.glow{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:radial-gradient(circle,rgba(246,196,49,.55) 0%,rgba(246,196,49,0) 65%);animation:pulse .5s ease-in-out infinite alternate;pointer-events:none}
.stage{perspective:700px;width:130px;height:130px;position:relative}
.cube{width:130px;height:130px;position:relative;transform-style:preserve-3d;animation:spin 1.35s cubic-bezier(.45,0,.25,1) forwards}
.cube .f{position:absolute;inset:0;border:4px solid var(--sun);border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 5px var(--red),inset 0 0 0 7px var(--sun-2)}
.cube .f svg{width:70%;height:70%}
.cube .f1{transform:translateZ(65px)}.cube .f2{transform:rotateY(180deg) translateZ(65px)}.cube .f3{transform:rotateY(90deg) translateZ(65px)}
.cube .f4{transform:rotateY(-90deg) translateZ(65px)}.cube .f5{transform:rotateX(90deg) translateZ(65px);background:var(--night-2)}.cube .f6{transform:rotateX(-90deg) translateZ(65px);background:var(--night-2)}
.anim-cap{font-family:var(--display);font-size:24px;color:var(--sun-2);letter-spacing:.1em;margin:0;position:relative}
.rays{position:fixed;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(var(--ray,#ffd35a) 0deg 7deg,transparent 7deg 17deg);-webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 18%,transparent 48%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 18%,transparent 48%);animation:rot 14s linear infinite,fade .5s ease both;pointer-events:none}
.rays.l{background:repeating-conic-gradient(#ff9ad5 0deg 7deg,transparent 7deg 15deg,#8fe1ff 15deg 22deg,transparent 22deg 30deg,#fff08a 30deg 37deg,transparent 37deg 45deg,#b7f59a 45deg 52deg,transparent 52deg 60deg)}
.flash{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;animation:flash .55s ease-out forwards;pointer-events:none}
.headline{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,64px);color:var(--sun);text-shadow:0 3px 0 var(--red),0 0 24px rgba(246,196,49,.6);margin:0;position:relative;text-align:center;animation:drop .5s cubic-bezier(.2,1.5,.4,1) both}
.fly-row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;position:relative;max-width:1000px}
.fly{width:210px;display:flex;animation:pop .7s cubic-bezier(.2,1.35,.4,1) both}
.fly-row.many .fly{width:160px}
.fly-row.many .window{height:78px}
.tap{position:relative;color:var(--muted);font-size:15px;margin:0}
@keyframes spin{0%{transform:rotateX(-20deg) rotateY(0) scale(.5)}70%{transform:rotateX(-20deg) rotateY(990deg) scale(1)}80%{transform:rotateX(-14deg) rotateY(990deg) scale(1.12) translateY(-6px)}88%{transform:rotateX(-24deg) rotateY(1000deg) scale(1.05) translateX(-6px)}94%{transform:rotateX(-18deg) rotateY(980deg) scale(1.1) translateX(6px)}100%{transform:rotateX(-20deg) rotateY(990deg) scale(1.2)}}
@keyframes pulse{from{transform:scale(.85);opacity:.7}to{transform:scale(1.1);opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flash{0%{transform:scale(1);opacity:1}100%{transform:scale(40);opacity:0}}
@keyframes pop{0%{transform:translateY(120px) scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes drop{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}

@media (max-width:760px){
  .table{grid-template-columns:minmax(0,1fr)}
  .seal-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .mini-btns{width:auto;flex:1;min-width:180px}
  .seal{width:140px;height:140px}
  .seal b{font-size:26px}
  .detail{grid-template-columns:minmax(0,1fr)}
  .hand{gap:8px}
  .slot .face{padding:6px}
  .slot .name{font-size:13px}
  .slot .txt{font-size:11.5px}
  .slot .window{height:44px}
  .slot .tags{display:none}
  .fly{width:170px}
  .fly-row.many .fly{width:140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Illustrated collector's edition */
:root{--night:#101c38;--night-2:#172847;--night-3:#233d68;--fg:#f4e9d1;--muted:#acaeae;--sun:#d6b365;--sun-2:#f3d797;--line:#b99a5355;--paper:#f4e8ca;--paper-2:#e8d9b6;--red:#a63e30}
body{background-color:#101c38;background-image:radial-gradient(ellipse at 50% 12%,#27416a55,transparent 60%),radial-gradient(circle at 12% 18%,#d6b36555 0 1px,transparent 1.4px),radial-gradient(circle at 63% 72%,#fff6 0 .7px,transparent 1px);background-size:100% 100%,260px 260px,190px 190px}
.wrap{max-width:1260px;padding:32px 36px 40px;gap:34px}
.top{order:0;padding-bottom:24px;border-bottom:1px solid var(--line);align-items:center}
.brand:before{content:'THE INTERNET, IMMORTALISED';font:10px/2 Arial,sans-serif;letter-spacing:.28em;color:var(--sun)}
.brand h1{font-size:52px;text-shadow:none;color:var(--fg);font-weight:500;letter-spacing:-.035em}
.brand p{font-size:14px;color:var(--muted);margin-top:6px}
.stats{gap:0;align-items:center}.stat{border:0;border-left:1px solid var(--line);background:none;border-radius:0;padding:3px 18px;min-width:80px}.stat b{font-size:27px;font-weight:500;color:var(--fg)}.stat span{font:9px/2 Arial,sans-serif;letter-spacing:.13em}.stats>.btn{margin-left:12px}
.table{order:1;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:center;position:relative;padding:18px 24px 28px;border-bottom:1px solid var(--line)}
.seal-col:before{content:'LET FATE DECIDE';font:10px Arial,sans-serif;letter-spacing:.24em;color:var(--sun);margin-bottom:24px}
.seal{width:158px;height:158px;box-shadow:0 0 0 2px #9d7437,0 0 0 7px #101c38,0 0 0 8px #b18b4555,0 16px 38px #0007,inset 0 -8px 16px #3c080480;background:radial-gradient(circle at 40% 25%,#cb5840,#922a24 65%,#5a201e)}
.seal:before{border:1px solid #f6d28d77;inset:10px}.seal b{font-size:33px;color:#f5dfb3;font-weight:500}.seal span{color:#f0ceaa;font-size:13px}.mini-btns{margin-top:22px;max-width:220px}.btn{border:1px solid var(--line);border-radius:4px;background:transparent;font-size:13px;padding:9px 14px;transition:background .2s,transform .2s}.btn:hover:not(:disabled){background:#d6b36516}.btn.gold{background:#c6a45b;color:#17243c;border-color:#c6a45b}
.empty-table{border:0;background:none;padding:0;min-height:360px;gap:10px}.empty-table>b{font-size:27px;font-weight:500;color:var(--fg)}.empty-table>span{max-width:380px;font-size:14px}

function spokes(cx,cy,r,n,col,w){let s='';for(let i=0;i<n;i++){const a=Math.PI*2/n*i;s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a)).toFixed(1)+'" y2="'+(cy+r*Math.sin(a)).toFixed(1)+'" stroke="'+col+'" stroke-width="'+(w||1.5)+'"/>'}return s}

function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
const rnd=Math.random;
function pickW(items,wf){let t=0;const ws=items.map(i=>{const w=Math.max(0,wf(i));t+=w;return w});if(t<=0)return items[Math.floor(rnd()*items.length)];let x=rnd()*t;for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i]}return items[items.length-1]}

/* ---------- state ---------- */
let P={col:{},copium:0,season:1};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.col)P=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function freshSeason(){
  const s={opens:OPENS,openIdx:0,hand:[null,null,null],dupes:{},removed:[],news:[],masked:[],disabled:[],
    mew:0,stonks:0,crash:0,pop:0,aura:0,auraReady:false,sinceNew:0,monke:0,assRemoved:0,assUsed:false,swapsUsed:0,
    ayb:null,aybUsed:false,lock:0,last:[],lastEmpty:false,log:[],pending:null,over:false,detail:null,anim:null};
  if(P.col[36])s.hand[0]={id:36,stars:1};
  return s;
}
let S=freshSeason();
let toastMsg='',toastT=0;
function log(msg){S.log.unshift({n:S.openIdx,msg});S.log=S.log.slice(0,8)}
function toast(msg){toastMsg=msg;clearTimeout(toastT);toastT=setTimeout(()=>{toastMsg='';renderLayer()},3200);renderLayer()}

/* ---------- hand ---------- */
function handCards(){
  const list=[];
  S.hand.forEach((h,i)=>{if(h&&h.id)list.push({c:BY[h.id],stars:h.stars,slot:i,lv:h.stars-1,a:h.stars>=3?.5:1,pow:1,off:false})});
  if(S.ayb&&S.ayb.left>0)list.push({c:BY[S.ayb.id],stars:1,slot:3,lv:0,a:1,pow:1,off:false,virtual:true});
  const others=(x,t)=>list.some(o=>o!==x&&o.c.id!==15&&o.c.tags.includes(t));
  list.forEach(x=>{
    if(S.disabled.includes(x.c.id)&&!x.virtual){x.off=true;x.why='All Your Base took its effect'}
    if((x.c.id===6||x.c.id===13)&&others(x,'S')){x.off=true;x.why='Sigma in hand'}
    if(x.c.id===30&&others(x,'B')){x.off=true;x.why='Brainrot in hand'}
  });
  const giga=list.find(x=>x.c.id===23&&!x.off);
  if(giga)list.forEach(x=>{if(x!==giga)x.pow*=giga.c.v[giga.lv]});
  const gb=list.find(x=>x.c.id===26&&!x.off);
  if(gb){const step=gb.c.v[gb.lv]/100*gb.pow;list.slice().sort((a,b)=>a.slot-b.slot).forEach((x,k)=>{x.pow*=1+k*step;if(k===0)x.pow*=1-.2*gb.a})}
  return list;
}
function num(h){const v=h.c.v[h.lv];return typeof v==='number'?v:0}
function pv(h){return num(h)*h.pow}
function activeSets(live){
  const on=[];const wildH=live.find(h=>h.c.id===15);const wild=wildH?num(wildH):0;
  Object.keys(TAGS).forEach(t=>{
    const base=live.filter(h=>h.c.id!==15&&h.c.tags.includes(t)).length;
    const rest=live.filter(h=>h.c.id!==15&&!h.c.tags.includes(t)).length;
    const n=base+Math.min(wild,rest+(wildH?1:0));
    if(base>0&&n>=3)on.push(t);
  });
  return on;
}

/* ---------- rolling ---------- */
function pickNew(r){const pool=CARDS.filter(c=>c.r===r&&!P.col[c.id]&&c.id!==36);return pool.length?pool[Math.floor(rnd()*pool.length)]:null}
function pickNewAny(){const pool=CARDS.filter(c=>!P.col[c.id]&&c.id!==36);return pool.length?pickW(pool,c=>R[c.r].w):null}
function pickOld(r){const pool=CARDS.filter(c=>c.r===r&&P.col[c.id]&&c.id!==36);return pool.length?pool[Math.floor(rnd()*pool.length)]:null}
function rarWeights(ctx){
  const w={};ORD.forEach(r=>w[r]=Math.max(0,(R[r].w+ctx.add[r])*ctx.mul[r]));
  if(P.col[36])w.m=0;
  if(ctx.onlyCommon){ORD.forEach(r=>w[r]=r==='c'?1:0)}
  if(ctx.minR){const k=ORD.indexOf(ctx.minR);ORD.forEach((r,i)=>{if(i<k)w[r]=0})}
  return w;
}
function tagMul(ctx,c){let s=0;c.tags.forEach(t=>s+=ctx.tag[t]);return s/c.tags.length}
function drawCard(ctx,forceNew){
  const w=rarWeights(ctx);
  if(forceNew){
    const pool=CARDS.filter(c=>!P.col[c.id]&&w[c.r]>0&&!S.removed.includes(c.id));
    if(pool.length)return pickW(pool,c=>w[c.r]/Math.max(1,CARDS.filter(x=>x.r===c.r&&!P.col[x.id]).length)*tagMul(ctx,c));
  }
  const r=pickW(ORD,r=>w[r]);
  let pool=CARDS.filter(c=>c.r===r&&!S.removed.includes(c.id));
  if(!pool.length)pool=CARDS.filter(c=>c.r===r);
  return pickW(pool,c=>{const own=P.col[c.id];const fresh=(c.r==='c'&&!ctx.noDecay)?Math.pow(.95,S.dupes[c.id]||0):1;return tagMul(ctx,c)*(own?(1+ctx.dupeBias)*fresh:ctx.newMul)});
}
function removeFromHand(id){S.hand=S.hand.map(h=>h&&h.id===id?null:h);if(id===23)S.hand=S.hand.map(h=>h&&h.block?null:h)}

function pre(ctx,h){
  const id=h.c.id,a=h.a,v=pv(h),raw=num(h);
  switch(id){
    case 1:Object.keys(ctx.tag).forEach(t=>ctx.tag[t]*=t==='B'?1+v/100:1-.1*a);break;
    case 2:['e','l','m'].forEach(r=>ctx.mul[r]*=1-.1*a);break;
    case 3:
      if(S.openIdx%10===0&&rnd()<a){ctx.forcedEmpty=true;log('Girl Dinner: the plate was empty, the open was wasted')}
      else if(S.openIdx%3===0){ctx.forced=Math.max(ctx.forced,h.lv===0?2:3);if(h.lv===2)ctx.forceNew=true;log('Girl Dinner served an extra plate')}
      break;
    case 4:ctx.forced=Math.max(ctx.forced,raw);ctx.bomb=true;log('Roman Empire: the legions march in');break;
    case 5:if(!S.assUsed&&rnd()<.05*a){const vs=S.hand.filter(x=>x&&x.id&&x.id!==5&&x.id!==36);if(vs.length){const vv=vs[Math.floor(rnd()*vs.length)];removeFromHand(vv.id);S.assUsed=true;log('Dancing Raccoon stole '+BY[vv.id].name+' from your hand')}}break;
    case 6:ctx.mul.r*=1+v/100;break;
    case 7:ctx.noDecay=true;if(h.lv>=1)ctx.copMul*=2;ctx.multiMul*=1-.5*a;break;
    case 10:ctx.add.l+=S.mew*v;if(S.mew>0)ctx.multiMul*=1-a;break;
    case 11:if(S.opens===0){ctx.forceNew=true;ctx.minR=h.lv===1?'r':h.lv===2?'e':ctx.minR;log('Nihilist Penguin walked off for one last card')}break;
    case 12:ctx.dupeBias+=.1*a;break;
    case 17:ctx.empty+=.1*a;ctx.forced=Math.max(ctx.forced,2);if(h.lv===2)ctx.add.e+=5;break;
    case 18:S.pop+=v;ctx.dbl+=S.pop/100;break;
    case 19:ctx.newMul*=1+v/100;if(rnd()<.07*a){ctx.burn++;log('Dead Inside: 1000 − 7, an open burned')}break;
    case 20:ctx.mul.e*=1+v/100;ctx.mul.l*=1-.5*a;break;
    case 21:ctx.mul.c*=1+v/100;['e','l','m'].forEach(r=>ctx.mul[r]*=1-.1*a);break;
    case 22:if(S.monke>0){ctx.forced=Math.max(ctx.forced,2);S.monke--}break;
    case 25:ctx.add.l+=S.stonks;break;
    case 27:ctx.trip+=v/100;ctx.datboi=h;break;
    case 28:{
      const good=[['refund an open',()=>ctx.refund++],['+2% to Legendary',()=>ctx.add.l+=2],['double drop',()=>ctx.forced=Math.max(ctx.forced,2)],['+30% to new cards',()=>ctx.newMul*=1.3],['+3 Copium',()=>P.copium+=3]];
      const bad=[['burned an open',()=>ctx.burn++],['Commons only',()=>ctx.onlyCommon=true],['−3 Copium',()=>P.copium=Math.max(0,P.copium-3)]];
      const got=[];for(let i=0;i<raw;i++){if(rnd()<.3*a){const b=bad[Math.floor(rnd()*bad.length)];b[1]();got.push('penalty: '+b[0])}else{const g=good[Math.floor(rnd()*good.length)];g[1]();got.push(g[0])}}
      log('Doge: '+got.join(', '));break;}
    case 30:ctx.tag.R*=1+v/100;break;
    case 32:if(S.sinceNew>=raw-1){ctx.forceNew=true;log('Longcat stretched all the way to a new card')}if(rnd()<.1*a)ctx.rick=true;break;
    case 33:Object.keys(ctx.tag).forEach(t=>ctx.tag[t]*=t==='A'?raw:1-.3*a);break;
    case 35:if(S.openIdx%raw===0){ctx.forced=Math.max(ctx.forced,3);log('Ceiling Cat dropped three cards through the ceiling')}ctx.empty+=.05*a;break;
  }
}

function processDrop(ctx,c){
  const has=id=>ctx.live.find(h=>h.c.id===id);
  const d={c,isNew:!P.col[c.id],masked:false,notes:[],level:false};
  let h;
  if(!d.isNew){
    if((h=has(8))&&rnd()<pv(h)/100){const n=pickNew(c.r);if(n){d.c=n;d.isNew=true;d.notes.push('Moo Deng bit the dupe into a new card')}}
    if(!d.isNew&&(h=has(31))&&rnd()<pv(h)/100){const n=pickNew(c.r)||pickNewAny();if(n){d.c=n;d.isNew=true;d.notes.push('O RLY Owl: that dupe? YA RLY, it is new')}}
    if(!d.isNew&&(h=has(16))&&rnd()<pv(h)/100){
      if(rnd()<.25*h.a){log('Cat at the Table rerolled a dupe into the void');return null}
      const c2=drawCard(ctx,false);d.c=c2;d.isNew=!P.col[c2.id];d.notes.push('Cat at the Table disagreed and rerolled');
    }
  }else if((h=has(8))&&rnd()<.05*h.a){const o=pickOld(c.r);if(o){d.c=o;d.isNew=false;d.notes.push('Moo Deng bit the wrong card')}}
  const id=d.c.id;
  if(d.isNew){
    P.col[id]=1;S.news.push(id);S.sinceNew=0;
    if((h=has(31))&&rnd()<.05*h.a){d.masked=true;S.masked.push(id)}
    if(d.c.r==='c'){
      if((h=has(2))&&rnd()<pv(h)/100){S.opens++;d.notes.push('Six Seven: +1 open')}
      if(ctx.sets.includes('B')){S.opens++;d.notes.push('Brainrot set: +1 open')}
      if((h=has(9))&&S.aura>0&&rnd()<h.a){S.aura=0;d.notes.push('A new Common reset your aura')}
    }
    if((h=has(34))&&!h.virtual&&!S.aybUsed&&id!==34){S.ayb={id,left:AYB_LEFT[h.lv]};S.aybUsed=true;S.disabled.push(id);d.notes.push('All Your Base captured the effect of '+d.c.name)}
    if((h=has(24))&&!h.virtual&&rnd()<.1*h.a&&id!==23&&!S.hand.some(x=>x&&x.id===id)){S.hand[h.slot]={id,stars:1};d.notes.push('The Dress changed color and became '+d.c.name)}
  }else{
    P.col[id]=(P.col[id]||0)+1;S.dupes[id]=(S.dupes[id]||0)+1;
    let cop=ctx.copMul;if((h=has(12)))cop*=num(h);P.copium+=Math.round(cop);
    if((h=has(13))&&rnd()<pv(h)/100){S.opens++;d.notes.push('Moth & Lamp refunded an open')}
    if(ctx.sets.includes('D')&&rnd()<.5){S.opens++;d.notes.push('Doomer set refunded an open')}
    if((h=has(7))&&h.lv===2&&rnd()<.1){S.opens++;d.notes.push('Rizz refunded an open')}
    if((h=has(9))){S.aura++;if(S.aura>=num(h)){S.auraReady=true;S.aura=0;d.notes.push('Aura charged: the next card is Epic or better')}}
    if((h=has(18))){S.pop=h.a===1?0:S.pop/2}
    const slot=S.hand.find(x=>x&&x.id===id);
    if(slot&&slot.stars<3){slot.stars++;d.level=true;d.notes.push(d.c.name+' leveled up to '+'★'.repeat(slot.stars));if(id===23&&slot.stars===3)S.hand=S.hand.map(x=>x&&x.block?null:x)}
  }
  if(d.c.r==='c'&&(h=has(5))&&S.assRemoved<num(h)&&!S.removed.includes(id)){S.removed.push(id);S.assRemoved++;d.notes.push('Dancing Raccoon stole '+d.c.name+' from this season’s pool')}
  return d;
}

function openBox(){
  if(S.over||S.opens<=0||S.lock>Date.now()||S.pending||S.anim)return;
  S.openIdx++;S.opens--;S.sinceNew++;
  const hand=handCards();
  const ctx={add:{c:0,r:0,e:0,l:0,m:0},mul:{c:1,r:1,e:1,l:1,m:1},tag:{B:1,S:1,D:1,A:1,I:1,R:1},newMul:1,dupeBias:0,forced:1,dbl:0,trip:0,multiMul:1,empty:0,forcedEmpty:false,forceNew:false,minR:null,onlyCommon:false,burn:0,refund:0,noDecay:false,copMul:1,live:[],sets:[]};
  let fox=1;const f=hand.find(h=>h.c.id===29&&!h.off);
  if(f){const r=rnd(),p=pv(f)/100;if(r<p){fox=2;log('Stoned Fox: hand effects fired twice')}else if(r<p+.1*f.a){fox=0;log('Stoned Fox: hand effects did not fire')}}
  if(fox===2)hand.forEach(h=>{if(h!==f)h.pow*=2});
  ctx.live=fox===0?hand.filter(h=>h===f):hand.filter(h=>!h.off);
  ctx.sets=activeSets(ctx.live);
  if(ctx.sets.includes('S'))ctx.multiMul*=2;
  if(ctx.sets.includes('A'))ctx.newMul*=1.1;
  if(ctx.sets.includes('I'))ctx.add.l+=1.5;
  if(ctx.sets.includes('R'))ctx.copMul*=3;
  ctx.live.forEach(h=>pre(ctx,h));
  if(S.crash>0){ctx.onlyCommon=true;S.crash--;log('Stonks crashed: Commons only')}
  if(S.auraReady){ctx.minR='e';S.auraReady=false}
  let count=ctx.forced;
  if(ctx.forcedEmpty||rnd()<ctx.empty){count=0;if(!ctx.forcedEmpty)log('The box was empty. Thanks for playing.')}
  else if(count===1){if(rnd()<ctx.trip*ctx.multiMul)count=3;else if(rnd()<Math.min(.95,ctx.dbl*ctx.multiMul))count=2}
  const drops=[];
  for(let i=0;i<count;i++){const c=drawCard(ctx,ctx.forceNew&&i===0);const d=processDrop(ctx,c);if(d)drops.push(d)}
  const has=id=>ctx.live.find(h=>h.c.id===id);
  let h;
  if((h=has(10)))S.mew=drops.some(d=>!d.isNew)?0:S.mew+1;else S.mew=0;
  if((h=has(25))){if(drops.some(d=>d.c.r==='l')){S.stonks=0;S.crash=Math.round(5*h.a);log('Stonks: a Legendary! Crash incoming')}else S.stonks+=pv(h)}else S.stonks=0;
  if(count===3&&ctx.datboi&&rnd()<ctx.datboi.a){ctx.burn++;log('Dat Boi: the triple drop cost 2 opens')}
  if(ctx.bomb)removeFromHand(4);
  if((h=has(14))&&!h.virtual&&rnd()<.03*h.a){removeFromHand(14);log('Big Floppa walked out of your hand')}
  if(S.ayb&&ctx.live.some(x=>x.virtual)){S.ayb.left--;if(S.ayb.left<=0){S.ayb=null;log('All Your Base released the captured effect')}}
  S.opens=Math.max(0,S.opens-ctx.burn+ctx.refund);
  if(!hand.some(x=>x.c.id===18))S.pop=0;
  S.last=drops;S.lastEmpty=count===0;
  drops.forEach(d=>d.notes.forEach(n=>log(n)));
  save();
  if(S.opens<=0)S.over=true;
  S.anim={drops,empty:count===0,rick:!!ctx.rick};
  render();
  showAnim();
}

/* ---------- opening animation ---------- */
let animT=0;
function reduced(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
function showAnim(){
  const A=document.getElementById('anim');
  const faces=[1,2,3,4,5,6].map(i=>'<div class="f f'+i+'">'+BOX_EMBLEM+'</div>').join('');
  A.innerHTML='<div class="anim" data-act="anim-skip" role="dialog" aria-label="Opening the box"><div class="glow"></div><div class="stage"><div class="cube">'+faces+'</div></div><p class="anim-cap">Opening…</p></div>';
  sfx.spin();
  clearTimeout(animT);animT=setTimeout(revealAnim,reduced()?0:1400);
}
function bestRar(drops){let k=-1;drops.forEach(d=>{const r=d.masked?0:ORD.indexOf(d.c.r);if(r>k)k=r});return k<0?null:ORD[k]}
function revealAnim(){
  clearTimeout(animT);
  if(!S.anim||S.anim.phase==='reveal')return;
  S.anim.phase='reveal';
  const A=document.getElementById('anim');const drops=S.anim.drops;
  const best=bestRar(drops);
  const newCount=drops.filter(d=>d.isNew&&!d.masked).length;
  const rayCol={c:'#9fc4ff',r:'#eef2f7',e:'#ffd35a',l:'',m:'#e8cf95'};
  let head,sub='';
  if(S.anim.empty){head='Empty!';sub='Thanks for playing.'}
  else if(newCount>1)head=newCount+' new cards!';
  else if(newCount===1)head='New card!';
  else head=drops.length>1?'Dupes':'Dupe';
  let h='<div class="anim" data-act="anim-close" role="dialog" aria-label="Box opened">';
  if(!S.anim.empty)h+='<div class="rays'+(best==='l'?' l':'')+'" style="--ray:'+(newCount?rayCol[best]:'#8a93b8')+'"></div><div class="flash"></div>';
  h+='<p class="headline">'+head+'</p>';
  if(sub)h+='<p class="tap">'+sub+'</p>';
  h+='<div class="fly-row'+(drops.length>3?' many':'')+'">';
  drops.forEach((d,i)=>{
    const stamp=d.masked?'<span class="stamp mask">Dupe?</span>':d.isNew?'<span class="stamp new">New</span>':'<span class="stamp dup">Dupe</span>';
    h+='<div class="fly" style="animation-delay:'+(.12+i*.14)+'s">'+(d.masked?maskedHtml(stamp):cardHtml(d.c,{stamp,noFlavor:drops.length>3}))+'</div>';
  });
  h+='</div><p class="tap">Tap anywhere to collect</p></div>';
  A.innerHTML=h;
  if(S.anim.empty)sfx.empty();
  else{
    if(newCount)sfx.fanfare(best);else sfx.dupe();
    setTimeout(()=>sfx.rustle(Math.min(drops.length,4)),120);
    if(drops.some(d=>d.level))setTimeout(()=>sfx.level(),700);
  }
}
function closeAnim(){
  const A=document.getElementById('anim');A.innerHTML='';
  const rick=S.anim&&S.anim.rick;S.anim=null;
  if(rick){S.lock=Date.now()+5000;sfx.rick();tickRick()}
  render();
}
function tickRick(){renderLayer();if(S.lock>Date.now())setTimeout(tickRick,250);else{S.lock=0;renderLayer();render()}}

/* ---------- actions ---------- */
function freeSwapsLeft(){const db=S.hand.find(x=>x&&x.id===24);if(!db)return 0;return BY[24].v[db.stars-1]-S.swapsUsed}
function placeCost(slot){const cur=S.hand[slot];if(!cur)return 0;if(cur.id===24)return 1;return freeSwapsLeft()>0?0:1}
function place(id,slot){
  const cur=S.hand[slot];
  if(cur&&cur.id===36){toast('Kilroy was here, and Kilroy is staying.');return}
  if(S.hand.some(x=>x&&x.id===id)){toast('This card is already in your hand.');return}
  let cost=0;
  if(cur){if(cur.id!==24&&freeSwapsLeft()>0)S.swapsUsed++;else cost=1}
  if(cost>S.opens){toast('A swap costs 1 open, and you have none left.');return}
  S.opens-=cost;
  if(cur&&cur.block)removeFromHand(23);
  if(cur&&cur.id)removeFromHand(cur.id);
  S.hand[slot]={id,stars:1};
  if(id===23){let other=S.hand.findIndex((x,i)=>i!==slot&&!x);if(other<0)other=S.hand.findIndex((x,i)=>i!==slot&&x&&x.id!==36);if(other>=0)S.hand[other]={block:true}}
  if(id===22){S.hand=S.hand.map((x,i)=>i===slot||(x&&x.id===36)?x:null);S.monke=BY[22].v[0];log('Return to Monke cleared the rest of your hand')}
  if(id===11){S.opens=Math.max(0,S.opens-3);log('Nihilist Penguin took 3 opens')}
  log('Into your hand: '+BY[id].name+(cost?' (swap cost 1 open)':''));
  S.pending=null;
  if(S.opens<=0)S.over=true;
  sfx.rustle(1);sfx.click();
  render();
}
function buyOpen(){if(P.copium<SHOP||S.over)return;P.copium-=SHOP;S.opens++;log('Bought an open for '+SHOP+' Copium');sfx.coin();save();render()}
let resetArmed=false;
function newSeason(){P.season++;save();S=freshSeason();sfx.rustle(3);render();renderLayer()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=+b.dataset.id,slot=+b.dataset.slot;
  if(act==='anim-skip'){revealAnim();return}
  if(act==='anim-close'){sfx.click();closeAnim();return}
  if(act==='open'){openBox();return}
  if(act==='artbook'){openArtbook();return}
  if(act==='art-zoom'){openArtwork(id);return}
  if(act==='art-close'){document.getElementById('artwork').close();return}
  if(act==='book-close'){document.getElementById('artbook').close();return}
  if(act!=='sound')sfx.click();
  if(act==='take'){
    const empty=S.hand.findIndex(x=>!x);const freeCount=S.hand.filter(x=>!x).length;
    if(empty>=0&&freeCount>=(id===23?2:1))place(id,empty);else{S.pending=id;render()}
  }
  else if(act==='slot'&&S.pending)place(S.pending,slot);
  else if(act==='cancel'){S.pending=null;render()}
  else if(act==='buy')buyOpen();
  else if(act==='gems')toast('This is a game about microtransactions. You cannot pay. Think about that.');
  else if(act==='detail'){S.detail=S.detail===id?null:id;sfx.rustle(1);render()}
  else if(act==='season')newSeason();
  else if(act==='sound'){muted=!muted;try{localStorage.setItem(KEY+'-mute',muted?'1':'0')}catch(err){}if(!muted)sfx.click();render()}
  else if(act==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Sure? Click again';setTimeout(()=>{resetArmed=false;render()},3000);return}
    resetArmed=false;P={col:{},copium:0,season:1};save();S=freshSeason();render();renderLayer();
  }
});

/* ---------- render ---------- */
function tagsHtml(c){return '<div class="tags">'+c.tags.map(t=>'<span class="tag t-'+t+'">'+TAGS[t]+'</span>').join('')+'</div>'}
function starsStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function cardHtml(c,opt){
  opt=opt||{};const stars=opt.stars||1;const lv=stars-1;const mythic=c.r==='m';
  return '<div class="card '+R[c.r].cls+(opt.dim?' dim':'')+'">'+(opt.stamp||'')+
  '<div class="face">'+
  '<div class="meta"><span>'+roman(c.year)+'</span><span class="rar">'+R[c.r].n+'</span></div>'+
  '<button type="button" class="window art-window" data-act="art-zoom" data-id="'+c.id+'" aria-label="View illustration: '+esc(c.name)+'">'+art(c)+'</button>'+
  '<div class="name">'+esc(c.name)+'</div>'+tagsHtml(c)+
  '<div><div class="lbl"><span>Effect</span><span class="st">'+(mythic?'eternal':starsStr(stars))+'</span></div><div class="txt">'+esc(effText(c,lv))+'</div></div>'+
  '<div class="anti"><div class="lbl"><span>Anti-effect</span>'+(stars>=3&&!mythic?'<span>halved</span>':'')+'</div><div class="txt">'+esc(c.anti)+'</div></div>'+
  (opt.off?'<div class="off">Disabled: '+esc(opt.off)+'</div>':'')+
  (opt.noFlavor?'':'<div class="flav">'+esc(c.flavor)+'</div>')+
  '</div></div>';
}
function maskedHtml(stamp){return '<div class="card fr-c">'+stamp+'<div class="face"><div class="meta"><span>???</span><span class="rar">???</span></div><div class="window" style="align-items:center;justify-content:center;font-family:var(--display);font-size:40px;color:#9a8f78">?</div><div class="name">Some dupe</div><div class="flav">You will find out when the season ends. O RLY?</div></div></div>'}
function openArtwork(id){
 let d=document.getElementById('artwork');
 if(!d){d=document.createElement('dialog');d.id='artwork';d.className='artwork';d.setAttribute('aria-labelledby','artwork-title');document.body.appendChild(d)}
 d.innerHTML='<div class="book-head"><h2 id="artwork-title">'+esc(BY[id].name)+'</h2><button class="btn" data-act="art-close" autofocus>Close ×</button></div><div class="full-art">'+art(BY[id])+'</div>';
 d.showModal();
}
function openArtbook(){
 let d=document.getElementById('artbook');
 if(!d){d=document.createElement('dialog');d.id='artbook';d.className='artbook';d.setAttribute('aria-labelledby','book-title');document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}})}
 d.innerHTML='<div class="book-head"><div><h2 id="book-title">The Arcana Archive</h2><p>36 illustrations · A look at the full deck. Your collection stays yours.</p></div><button class="btn book-close" data-act="book-close" autofocus>Close ×</button></div><div class="book-grid">'+CARDS.map(c=>cardHtml(c)).join('')+'</div>';
 d.showModal();
}

function collected(){return CARDS.filter(c=>P.col[c.id]&&!S.masked.includes(c.id)).length}

function render(){
  const hand=handCards();const live=hand.filter(h=>!h.off);const sets=activeSets(live);
  const locked=S.lock>Date.now();
  let h='';
  h+='<header class="top"><div class="brand"><h1>Meme Arcana</h1><p>A small collection of very online divinities.</p></div>'+
  '<div class="stats">'+
  '<div class="stat"><b>'+P.season+'</b><span>Season</span></div>'+
  '<div class="stat"><b>'+S.opens+'</b><span>Opens</span></div>'+
  '<div class="stat"><b>'+collected()+' / 36</b><span>Collection</span></div>'+
  '<div class="stat"><b>'+P.copium+'</b><span>Copium</span></div>'+
  '<button class="btn" data-act="sound" aria-pressed="'+(!muted)+'">Sound: '+(muted?'off':'on')+'</button>'+
  '</div></header>';

  h+='<section aria-labelledby="hand-h"><div class="sec-h"><h2 id="hand-h">Your Hand</h2><span class="hint">'+
    (S.pending?'Where should '+esc(BY[S.pending].name)+' go? <button class="btn" data-act="cancel">Cancel</button>':'Every season starts with an empty hand. Swapping a card costs 1 open.')+'</span></div>';
  h+='<div class="hand">';
  S.hand.forEach((x,i)=>{
    const pick=S.pending?'<button class="btn gold" data-act="slot" data-slot="'+i+'">Here · '+(placeCost(i)?'1 open':'free')+'</button>':'';
    if(!x){h+='<div class="slot empty">Empty slot'+pick+'</div>';return}
    if(x.block){h+='<div class="slot block"><span>Occupied by the Ice Bucket</span>'+pick+'</div>';return}
    const hc=hand.find(y=>y.slot===i);
    h+='<div class="slot">'+cardHtml(BY[x.id],{stars:x.stars,off:hc&&hc.off?hc.why:'',dim:hc&&hc.off,noFlavor:true})+(pick&&x.id!==36?'<div style="margin-top:8px;display:flex;justify-content:center">'+pick+'</div>':'')+'</div>';
  });
  h+='</div>';
  if(S.ayb)h+='<p style="color:var(--muted);margin:10px 0 0;font-size:14px">All Your Base 4th slot: '+esc(BY[S.ayb.id].name)+(S.ayb.left===Infinity?' for the whole season':', opens left: '+S.ayb.left)+'</p>';
  h+='<div class="sets">'+(sets.length?sets.map(t=>'<span class="chip on">'+TAGS[t]+' set: '+SETTXT[t]+'</span>').join(''):'<span class="none">Set bonus: three cards with the same tag in your hand.</span>')+
    (S.aura?'<span class="chip">Aura '+S.aura+'</span>':'')+(S.mew?'<span class="chip">Mewing streak '+S.mew+'</span>':'')+(S.stonks?'<span class="chip">Stonks +'+fmtNum(S.stonks)+'%</span>':'')+(S.pop?'<span class="chip">Popcat '+fmtNum(S.pop)+'%</span>':'')+(S.crash?'<span class="chip">Crash: '+S.crash+'</span>':'')+'</div>';
  h+='</section>';

  h+='<section class="table" aria-label="Opening boxes"><div class="seal-col">'+
    '<button class="seal" data-act="open" '+(S.over||S.opens<=0||locked||S.pending||S.anim?'disabled':'')+'><b>Open</b><span>'+(locked?'wait…':S.opens+' left')+'</span></button>'+
    '<div class="mini-btns"><button class="btn" data-act="buy" '+(P.copium<SHOP||S.over?'disabled':'')+'>+1 open · '+SHOP+' Copium</button>'+
    '<button class="btn gold" data-act="gems">Buy Gems</button></div></div>';
  h+='<div class="drops">';
  if(!S.last.length){
    h+='<div class="empty-table">'+(S.lastEmpty?'<b>Empty</b><span>The box was empty. Thanks for playing.</span>':'<div class="fan" aria-hidden="true">'+[8,14,28].map(id=>'<div class="fan-card"><small>'+R[BY[id].r].n+' · '+BY[id].year+'</small><div class="window">'+art(BY[id])+'</div><b>'+esc(BY[id].name)+'</b></div>').join('')+'</div><b>Your fate has a sense of humour.</b><span>Break the seal. Collect 36 arcana. Build a hand that bends the odds.</span>')+'</div>';
  }else{
    h+='<div class="drop-row">';
    S.last.forEach(d=>{
      const c=d.c;const inHand=S.hand.some(x=>x&&x.id===c.id);
      const stamp=d.masked?'<span class="stamp mask">Dupe?</span>':d.isNew?'<span class="stamp new">New</span>':'<span class="stamp dup">Dupe</span>';
      h+='<div class="drop">'+(d.masked?maskedHtml(stamp):cardHtml(c,{stamp}))+
        (!d.masked&&!S.over?'<button class="btn" data-act="take" data-id="'+c.id+'" '+(inHand||S.pending?'disabled':'')+'>'+(inHand?'Already in hand':'Put in hand')+'</button>':'')+'</div>';
    });
    h+='</div>';
  }
  h+='<ul class="log" aria-label="Log">'+S.log.slice(0,6).map(l=>'<li><b>#'+l.n+'</b> · '+esc(l.msg)+'</li>').join('')+'</ul>';
  h+='</div></section>';

  h+='<section aria-labelledby="coll-h"><div class="sec-h"><h2 id="coll-h">Collection</h2><span class="hint">The older the meme, the rarer the drop <button class="btn" data-act="artbook">View the art book ↗</button></span></div>';
  if(S.detail&&P.col[S.detail]&&!S.masked.includes(S.detail)){
    const c=BY[S.detail];
    h+='<div class="detail"><div>'+cardHtml(c,{stars:1})+'</div><div><h3>'+esc(c.name)+'</h3>'+
    (c.r==='m'?'<dl class="lv"><dt>∞</dt><dd>'+esc(effText(c,0))+'</dd></dl>':'<dl class="lv"><dt>★</dt><dd>'+esc(effText(c,0))+'</dd><dt>★★</dt><dd>'+esc(effText(c,1))+'</dd><dt>★★★</dt><dd>'+esc(effText(c,2))+', anti-effect halved</dd></dl>')+
    '<p>Dropped '+P.col[c.id]+' time'+(P.col[c.id]===1?'':'s')+'. Stars go up when you drop a dupe of a card that sits in your hand.</p></div></div>';
  }
  h+='<div class="coll">';
  CARDS.forEach(c=>{
    const own=P.col[c.id]&&!S.masked.includes(c.id);
    h+='<button class="cc '+R[c.r].cls+(own?'':' locked')+(S.detail===c.id?' sel':'')+'" '+(own?'data-act="detail" data-id="'+c.id+'"':'disabled')+' aria-label="'+(own?esc(c.name):R[c.r].n+', not found yet')+'"><span class="face">'+
      (own?'<span class="y">'+roman(c.year)+'</span><span class="thumb">'+art(c)+'</span><span class="n">'+esc(c.name)+'</span><span class="cnt">×'+P.col[c.id]+'</span>':'<span class="q">✧</span>')+
      '</span></button>';
  });
  h+='</div></section>';
  h+='<footer class="foot"><span>Drop rates: Common 60% · Rare 25% · Epic 11% · Legendary 3.5% · Mythic 0.5%. Disclosed as required by law. Honestly.</span><button class="btn" data-act="reset">Reset progress</button></footer>';
  document.getElementById('app').innerHTML=h;
  renderLayer();
}

function renderLayer(){
  const L=document.getElementById('layer');let h='';
  if(S.lock>Date.now()){
    const s=Math.ceil((S.lock-Date.now())/1000);
    h+='<div class="veil" role="dialog" aria-label="Longcat"><div class="rick"><div class="longcat">'+art(BY[32])+'</div>Longcat is loooooooong.<small>This animation cannot be skipped. '+s+' s left.</small></div></div>';
  }else if(S.over&&!S.anim){
    h+='<div class="veil" role="dialog" aria-labelledby="end-h"><div class="sheet">';
    if(collected()+S.masked.length>=36){
      h+='<h2 id="end-h">Collection complete</h2><p>All 36 arcana are yours. Congratulations, you beat a game about lootboxes.</p><p style="font-family:var(--display);font-size:26px;color:var(--sun)">Coming soon: Season 2. 120 new memes.</p>';
    }else{
      h+='<h2 id="end-h">Season '+P.season+' is over</h2>';
      const news=S.news.map(id=>BY[id].name);
      h+='<p>New cards this season: '+news.length+'. Collection: '+(collected()+S.masked.length)+' of 36.</p>';
      if(news.length)h+='<ul>'+news.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>';
      if(S.masked.length)h+='<p>O RLY Owl confesses: those “dupes” were actually new cards: '+S.masked.map(id=>esc(BY[id].name)).join(', ')+'. YA RLY.</p>';
      h+='<p style="color:var(--muted)">The next season starts with an empty hand again'+(P.col[36]?', except for Kilroy':'')+'.</p>';
    }
    h+='<button class="btn gold" data-act="season">New season</button></div></div>';
  }
  if(toastMsg)h+='<div class="toast" role="status">'+esc(toastMsg)+'</div>';
  L.innerHTML=h;
}

function start(data){if(data&&data.S){S=data.S;S.anim=null}render();if(S.lock>Date.now())tickRick()}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
})();
</script>
